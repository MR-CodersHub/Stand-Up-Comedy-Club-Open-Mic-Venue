<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In — Laughora</title>
    <link rel="icon" type="image/png" href="assets/favicon.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Outfit:wght@400;500;600;700;800&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
    <script>
        (function () {
            const theme = localStorage.getItem('theme') || 'dark';
            if (theme === 'light') document.documentElement.classList.add('light-theme');
        })();
    </script>
    <style>
        .auth-page {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 120px 24px 60px;
            position: relative;
            background: radial-gradient(ellipse at 50% 0%, rgba(176,38,255,0.08) 0%, transparent 60%);
        }
        .auth-card {
            width: 100%;
            max-width: 440px;
            background: rgba(9, 10, 24, 0.95);
            border: 1px solid rgba(176, 38, 255, 0.25);
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5), 0 0 30px rgba(176, 38, 255, 0.15);
            border-radius: 20px;
            padding: 40px 32px;
            backdrop-filter: blur(20px);
        }
        .auth-brand {
            text-align: center;
            margin-bottom: 32px;
        }
        .auth-brand .auth-logo {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            margin-bottom: 8px;
        }
        .auth-brand .auth-logo img {
            height: 36px;
        }
        .auth-brand h1 {
            font-size: 1.6rem;
            margin-bottom: 4px;
        }
        .auth-brand h1 a {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
        }
        .auth-brand p {
            font-size: 0.88rem;
            color: var(--color-text-muted);
        }
        .auth-divider {
            height: 1px;
            background: linear-gradient(90deg, transparent, rgba(176,38,255,0.3), transparent);
            margin: 24px 0;
        }
        .auth-options {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin: 20px 0;
        }
        .auth-remember {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 0.85rem;
            color: var(--color-text-slate);
            cursor: pointer;
        }
        .auth-remember input[type="checkbox"] {
            width: 16px;
            height: 16px;
            accent-color: var(--color-purple);
            cursor: pointer;
        }
        .auth-forgot {
            font-size: 0.82rem;
            color: var(--color-cyan);
            font-family: var(--font-alt);
            transition: color 0.2s ease, text-shadow 0.2s ease;
        }
        .auth-forgot:hover {
            color: var(--color-pink);
            text-shadow: var(--glow-pink);
        }
        .auth-switch {
            text-align: center;
            margin-top: 20px;
            font-size: 0.88rem;
            color: var(--color-text-slate);
        }
        .auth-switch a {
            color: var(--color-purple);
            font-weight: 600;
            transition: color 0.2s ease;
        }
        .auth-switch a:hover {
            color: var(--color-cyan);
        }
        .auth-error {
            display: none;
            background: rgba(255, 0, 127, 0.1);
            border: 1px solid rgba(255, 0, 127, 0.3);
            border-radius: 8px;
            padding: 10px 14px;
            font-size: 0.82rem;
            color: var(--color-pink);
            margin-bottom: 16px;
            text-align: center;
        }
        html.light-theme .auth-card {
            background: rgba(255, 255, 255, 0.95);
            border-color: rgba(139, 92, 246, 0.25);
            box-shadow: 0 20px 50px rgba(15, 23, 42, 0.08), 0 0 20px rgba(139, 92, 246, 0.08);
        }
    </style>
</head>
<body>


    <!-- Login Page -->
    <div class="auth-page">
        <div class="auth-card">
            <div class="auth-brand">
                <a href="index.html" class="auth-logo">
                    <img src="assets/logo.png" alt="Laughora">
                    <span class="logo-neon" style="font-size:1.4rem;">Laugh</span><span class="logo-accent" style="font-size:1.4rem;">ora</span>
                </a>
                <p>Sign in to your account</p>
            </div>

            <div class="auth-error" id="loginError"></div>

            <form id="loginForm">
                <div class="neon-form-group">
                    <label>Email</label>
                    <input type="email" id="loginEmail" class="neon-input" placeholder="Enter your email" required>
                </div>
                <div class="neon-form-group">
                    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;">
                        <label style="margin-bottom:0;">Password</label>
                        <a href="#" class="auth-forgot" id="forgotLink">Forgot Password?</a>
                    </div>
                    <div class="neon-password-wrapper">
                        <input type="password" id="loginPassword" class="neon-input" placeholder="••••••••" required>
                        <button type="button" class="password-toggle-btn" aria-label="Toggle password visibility">
                            <svg class="eye-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7Z"></path><circle cx="12" cy="12" r="3"></circle>
                            </svg>
                        </button>
                    </div>
                </div>

                <label class="auth-remember">
                    <input type="checkbox" id="rememberMe"> Remember me
                </label>

                <div class="auth-divider"></div>

                <button type="submit" class="neon-btn">Sign In</button>
            </form>

            <div class="auth-switch">
                Don't have an account? <a href="signup.html">Create Account</a>
            </div>
        </div>
    </div>



    <script src="script.js"></script>
    <script>
        (function() {
            const form = document.getElementById('loginForm');
            const errorDiv = document.getElementById('loginError');
            const emailInput = document.getElementById('loginEmail');
            const passwordInput = document.getElementById('loginPassword');
            const rememberMe = document.getElementById('rememberMe');
            const forgotLink = document.getElementById('forgotLink');

            // Load saved email if "remember me" was checked
            const savedEmail = localStorage.getItem('rememberedEmail');
            if (savedEmail) {
                emailInput.value = savedEmail;
                rememberMe.checked = true;
            }

            // Password toggle
            document.querySelector('.password-toggle-btn')?.addEventListener('click', function() {
                const wrapper = this.closest('.neon-password-wrapper');
                const input = wrapper.querySelector('input');
                if (input.type === 'password') {
                    input.type = 'text';
                    this.innerHTML = `<svg class="eye-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9.88 9.88a3 3 0 1 0 4.24 4.24"></path><path d="M10.73 5.08A10.43 10.43 0 0 1 12 5c7 0 10 7 10 7a13.16 13.16 0 0 1-1.67 2.68"></path><path d="M6.61 6.61A13.52 13.52 0 0 0 2 12s3 7 10 7a9.74 9.74 0 0 0 5.39-1.61"></path><line x1="2" y1="2" x2="22" y2="22"></line></svg>`;
                } else {
                    input.type = 'password';
                    this.innerHTML = `<svg class="eye-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7Z"></path><circle cx="12" cy="12" r="3"></circle></svg>`;
                }
            });

            // Forgot password link
            forgotLink.addEventListener('click', function(e) {
                e.preventDefault();
                const email = emailInput.value.trim();
                if (!email) {
                    errorDiv.textContent = 'Please enter your email address first.';
                    errorDiv.style.display = 'block';
                    return;
                }
                // Simulated password recovery
                const regEmail = localStorage.getItem('registeredEmail');
                if (regEmail && email.toLowerCase() === regEmail.toLowerCase()) {
                    localStorage.setItem('registeredPassword', 'neon123');
                } else {
                    localStorage.setItem('registeredEmail', email);
                    localStorage.setItem('registeredPassword', 'neon123');
                    localStorage.setItem('registeredName', 'Comedy Fan');
                    localStorage.setItem('registeredRole', 'user');
                }
                alert('A recovery link has been sent to ' + email + ' (simulated: password reset to "neon123")');
            });

            // Form submission
            form.addEventListener('submit', function(e) {
                e.preventDefault();
                errorDiv.style.display = 'none';

                const email = emailInput.value.trim();
                const password = passwordInput.value;

                // Remember me — persist session
                const persist = rememberMe.checked;
                if (persist) {
                    localStorage.setItem('rememberedEmail', email);
                } else {
                    localStorage.removeItem('rememberedEmail');
                }
                localStorage.setItem('isLoggedIn', persist ? 'true' : 'true');

                const regEmail = localStorage.getItem('registeredEmail');
                const regPassword = localStorage.getItem('registeredPassword');
                const regRole = localStorage.getItem('registeredRole');
                const regName = localStorage.getItem('registeredName');

                let currentRole = 'user';
                let currentName = 'Comedy Fan';

                if (regEmail && email.toLowerCase() === regEmail.toLowerCase()) {
                    if (password === regPassword) {
                        currentRole = regRole || 'user';
                        currentName = regName || 'Comedy Fan';
                    } else {
                        errorDiv.textContent = 'Invalid password. Please try again.';
                        errorDiv.style.display = 'block';
                        return;
                    }
                } else {
                    if (email.toLowerCase().includes('admin')) {
                        currentRole = 'admin';
                        currentName = 'Cosmic Admin';
                    }
                }

                localStorage.setItem('currentUserRole', currentRole);
                localStorage.setItem('currentUserName', currentName);

                // Redirect to dashboard based on role
                window.location.href = currentRole === 'admin' ? 'admin-dashboard.html' : 'user-dashboard.html';
            });
        })();
    </script>
</body>
</html>
