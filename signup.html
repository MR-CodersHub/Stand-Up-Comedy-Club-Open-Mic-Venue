<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Account — Laughora</title>
    <link rel="icon" type="image/png" href="assets/favicon.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Outfit:wght@400;500;600;700;800&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
    <script>
        (function () {
            const theme = localStorage.getItem('theme') || 'dark';
            if (theme === 'light') document.documentElement.classList.add('light-theme');
        })();
    </script>
    <style>
        .auth-page {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 120px 24px 60px;
            position: relative;
            background: radial-gradient(ellipse at 50% 0%, rgba(0,240,255,0.06) 0%, transparent 60%);
        }
        .auth-card {
            width: 100%;
            max-width: 440px;
            background: rgba(9, 10, 24, 0.95);
            border: 1px solid rgba(176, 38, 255, 0.25);
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5), 0 0 30px rgba(176, 38, 255, 0.15);
            border-radius: 20px;
            padding: 40px 32px;
            backdrop-filter: blur(20px);
        }
        .auth-brand {
            text-align: center;
            margin-bottom: 32px;
        }
        .auth-brand .auth-logo {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            margin-bottom: 8px;
        }
        .auth-brand .auth-logo img {
            height: 36px;
        }
        .auth-brand h1 {
            font-size: 1.6rem;
            margin-bottom: 4px;
        }
        .auth-brand p {
            font-size: 0.88rem;
            color: var(--color-text-muted);
        }
        .auth-divider {
            height: 1px;
            background: linear-gradient(90deg, transparent, rgba(176,38,255,0.3), transparent);
            margin: 24px 0;
        }
        .auth-switch {
            text-align: center;
            margin-top: 20px;
            font-size: 0.88rem;
            color: var(--color-text-slate);
        }
        .auth-switch a {
            color: var(--color-purple);
            font-weight: 600;
            transition: color 0.2s ease;
        }
        .auth-switch a:hover {
            color: var(--color-cyan);
        }
        .auth-error {
            display: none;
            background: rgba(255, 0, 127, 0.1);
            border: 1px solid rgba(255, 0, 127, 0.3);
            border-radius: 8px;
            padding: 10px 14px;
            font-size: 0.82rem;
            color: var(--color-pink);
            margin-bottom: 16px;
            text-align: center;
        }
        html.light-theme .auth-card {
            background: rgba(255, 255, 255, 0.95);
            border-color: rgba(139, 92, 246, 0.25);
            box-shadow: 0 20px 50px rgba(15, 23, 42, 0.08), 0 0 20px rgba(139, 92, 246, 0.08);
        }
    </style>
</head>
<body>


    <!-- Sign Up Page -->
    <div class="auth-page">
        <div class="auth-card">
            <div class="auth-brand">
                <a href="index.html" class="auth-logo">
                    <img src="assets/logo.png" alt="Laughora">
                    <span class="logo-neon" style="font-size:1.4rem;">Laugh</span><span class="logo-accent" style="font-size:1.4rem;">ora</span>
                </a>
                <p>Create your account</p>
            </div>

            <div class="auth-error" id="signupError"></div>

            <form id="signupForm">
                <div class="neon-form-group">
                    <label>Full Name</label>
                    <input type="text" id="signupName" class="neon-input" placeholder="e.g. Jane Doe" required>
                </div>
                <div class="neon-form-group">
                    <label>Email</label>
                    <input type="email" id="signupEmail" class="neon-input" placeholder="Enter your email" required>
                </div>
                <div class="neon-form-group">
                    <label>Account Type</label>
                    <div class="role-selector">
                        <div class="role-option active" data-role="user">Comedian / Fan</div>
                        <div class="role-option" data-role="admin">Venue Admin</div>
                    </div>
                </div>
                <div class="neon-form-group">
                    <label>Password</label>
                    <div class="neon-password-wrapper">
                        <input type="password" id="signupPassword" class="neon-input" placeholder="Create a password" required>
                        <button type="button" class="password-toggle-btn" aria-label="Toggle password visibility">
                            <svg class="eye-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7Z"></path><circle cx="12" cy="12" r="3"></circle>
                            </svg>
                        </button>
                    </div>
                </div>

                <div class="auth-divider"></div>

                <button type="submit" class="neon-btn">Create Account</button>
            </form>

            <div class="auth-switch">
                Already have an account? <a href="login.html">Sign In</a>
            </div>
        </div>
    </div>



    <script src="script.js"></script>
    <script>
        (function() {
            const form = document.getElementById('signupForm');
            const errorDiv = document.getElementById('signupError');
            const roleOptions = document.querySelectorAll('.role-option');
            let selectedRole = 'user';

            // Role selection
            roleOptions.forEach(opt => {
                opt.addEventListener('click', function() {
                    roleOptions.forEach(o => o.classList.remove('active'));
                    this.classList.add('active');
                    selectedRole = this.getAttribute('data-role');
                });
            });

            // Password toggle
            document.querySelector('.password-toggle-btn')?.addEventListener('click', function() {
                const wrapper = this.closest('.neon-password-wrapper');
                const input = wrapper.querySelector('input');
                if (input.type === 'password') {
                    input.type = 'text';
                    this.innerHTML = `<svg class="eye-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9.88 9.88a3 3 0 1 0 4.24 4.24"></path><path d="M10.73 5.08A10.43 10.43 0 0 1 12 5c7 0 10 7 10 7a13.16 13.16 0 0 1-1.67 2.68"></path><path d="M6.61 6.61A13.52 13.52 0 0 0 2 12s3 7 10 7a9.74 9.74 0 0 0 5.39-1.61"></path><line x1="2" y1="2" x2="22" y2="22"></line></svg>`;
                } else {
                    input.type = 'password';
                    this.innerHTML = `<svg class="eye-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7Z"></path><circle cx="12" cy="12" r="3"></circle></svg>`;
                }
            });

            // Form submission
            form.addEventListener('submit', function(e) {
                e.preventDefault();
                errorDiv.style.display = 'none';

                const name = document.getElementById('signupName').value.trim();
                const email = document.getElementById('signupEmail').value.trim();
                const password = document.getElementById('signupPassword').value;

                if (password.length < 6) {
                    errorDiv.textContent = 'Password must be at least 6 characters.';
                    errorDiv.style.display = 'block';
                    return;
                }

                localStorage.setItem('registeredEmail', email);
                localStorage.setItem('registeredName', name || (selectedRole === 'admin' ? 'Administrator' : 'Comedy Fan'));
                localStorage.setItem('registeredRole', selectedRole);
                localStorage.setItem('registeredPassword', password);
                localStorage.setItem('currentUserRole', selectedRole);
                localStorage.setItem('currentUserName', name || (selectedRole === 'admin' ? 'Administrator' : 'Comedy Fan'));
                localStorage.setItem('isLoggedIn', 'true');

                window.location.href = selectedRole === 'admin' ? 'admin-dashboard.html' : 'user-dashboard.html';
            });
        })();
    </script>
</body>
</html>
